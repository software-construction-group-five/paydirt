# Action names map to lists of keys. Screen sections allow context-specific keys.
# Named keys: up, down, left, right, enter, esc, space, tab, backspace,
# delete, home, end, pageup, pagedown, plus, backtab (or shift+tab). Modifiers: ctrl+, alt+, shift+.
# Global keys apply everywhere and must not conflict with screen bindings.

[global]
quit = ["q", "ctrl+c"]

[main_menu]
move_up = ["up", "w"]
move_down = ["down", "s"]
confirm = ["enter"]

[playing]
move_up = ["up", "w"]
move_down = ["down", "s"]
move_left = ["left", "a"]
move_right = ["right", "d"]
wait = ["."]
pause = ["esc"]

[inventory]
back = ["esc", "i"]

[paused]
pause = ["esc"]
confirm = ["enter"]
back = ["m"]

[game_over]
confirm = ["enter"]
